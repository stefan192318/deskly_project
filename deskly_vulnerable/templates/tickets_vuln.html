{% extends "base.html" %}
{% block content %}
<h1>Tickets (search vulnerabil)</h1>
<form method="GET">
    <input name="search" value="{{ search }}" placeholder="search">
    <button>Search</button>
</form>
<ul>
{% for row in tickets %}
    <li>
        ticket id={{ row[0] }} | title={{ row[1] }} | description={{ row[2] }} | severity={{ row[3] }} | status={{ row[4] }}
    </li>
{% endfor %}
</ul>
{% endblock %}
