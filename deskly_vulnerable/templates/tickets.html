{% extends "base.html" %}
{% block content %}
<h1>Tickets</h1>
<form method="GET">
    <input name="search" value="{{ search }}" placeholder="search">
    <button>Search</button>
</form>
<p><a href="{{ url_for('new_ticket') }}">New ticket</a></p>
<ul>
{% for ticket in tickets %}
    <li>
        <a href="{{ url_for('view_ticket', ticket_id=ticket.id) }}">{{ ticket.title }}</a>
        - {{ ticket.status }} - owner: {{ ticket.owner.email }}
    </li>
{% endfor %}
</ul>
{% endblock %}
