{% extends "base.html" %}
{% block content %}
<h1>{{ ticket.title }}</h1>
<p>Owner id: {{ ticket.owner_id }}</p>
<p>Severity: {{ ticket.severity }}</p>
<p>Status: {{ ticket.status }}</p>
<p>Description: {{ ticket.description|safe }}</p>

<p><a href="{{ url_for('edit_ticket', ticket_id=ticket.id) }}">Edit</a></p>

<form method="POST" action="{{ url_for('change_status', ticket_id=ticket.id) }}">
    <select name="status">
        <option>OPEN</option>
        <option>IN_PROGRESS</option>
        <option>RESOLVED</option>
    </select>
    <button>Change status</button>
</form>
{% endblock %}
