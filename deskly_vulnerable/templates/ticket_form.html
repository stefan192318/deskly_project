{% extends "base.html" %}
{% block content %}
<h1>{% if ticket %}Edit ticket{% else %}New ticket{% endif %}</h1>
<form method="POST">
    <p>Title: <input name="title" value="{{ ticket.title if ticket else '' }}"></p>
    <p>Description: <textarea name="description">{{ ticket.description if ticket else '' }}</textarea></p>
    <p>
        Severity:
        <select name="severity">
            <option {% if ticket and ticket.severity == 'LOW' %}selected{% endif %}>LOW</option>
            <option {% if ticket and ticket.severity == 'MEDIUM' %}selected{% endif %}>MEDIUM</option>
            <option {% if ticket and ticket.severity == 'HIGH' %}selected{% endif %}>HIGH</option>
        </select>
    </p>
    <p>
        Status:
        <select name="status">
            <option {% if ticket and ticket.status == 'OPEN' %}selected{% endif %}>OPEN</option>
            <option {% if ticket and ticket.status == 'IN_PROGRESS' %}selected{% endif %}>IN_PROGRESS</option>
            <option {% if ticket and ticket.status == 'RESOLVED' %}selected{% endif %}>RESOLVED</option>
        </select>
    </p>
    <button>Save</button>
</form>
{% endblock %}
